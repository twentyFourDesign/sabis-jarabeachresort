name: Deploy PHP App to DigitalOcean

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    - name: Deploy to Droplet
      env:
        SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com "echo $SUDO_PASSWORD | sudo -S rsync -avz --delete --no-times ./app/ /var/www/html/"

    - name: Create Test File on Droplet
      env:
        SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com "echo $SUDO_PASSWORD | sudo -S touch /var/www/html/test_file.txt"

    - name: Set Permissions
      env:
        SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com 'echo $SUDO_PASSWORD | sudo -S chown -R www-data:www-data /var/www/html && sudo chmod -R 755 /var/www/html'

    - name: Restart Apache
      env:
        SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com 'echo $SUDO_PASSWORD | sudo -S systemctl restart apache2'
