name: Deploy PHP App to DigitalOcean

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y rsync

    - name: Deploy to Droplet
      run: |
        rsync -avz --delete \
        -e "ssh -o StrictHostKeyChecking=no" \
        ./app/ sabis@sabis.jarabeachresort.com:/var/www/html/

    - name: Create Test File on Droplet
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com "touch /var/www/html/test_file.txt"

    - name: Set Permissions
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com 'sudo chown -R www-data:www-data /var/www/html && sudo chmod -R 755 /var/www/html'

    - name: Restart Apache
      run: |
        ssh -o StrictHostKeyChecking=no sabis@sabis.jarabeachresort.com 'sudo systemctl restart apache2'
